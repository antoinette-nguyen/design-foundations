<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Component — Card</title>
    <style>
      /* ── Tokens ── */
      :root {
        --color-bg: #fff;
        --color-surface: #f9f9f9;
        --color-border: #e8e8e8;
        --color-text: #111;
        --color-text-muted: #666;
        --color-tag-bg: #f0f0f0;
        --color-tag-text: #555;
        --color-accent: #111;

        --radius-sm: 6px;
        --radius-md: 12px;

        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-6: 24px;

        --shadow-md: 0 8px 24px rgba(0,0,0,0.08);

        --duration-base: 250ms;
      }

      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: #f4f4f4;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
        gap: 1.5rem;
        flex-wrap: wrap;
      }

      /* ── Card ── */
      .card {
        background: var(--color-bg);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-md);
        overflow: hidden;
        width: 280px;
        transition: transform var(--duration-base) ease,
                    box-shadow var(--duration-base) ease;
        cursor: pointer;
      }

      .card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-md);
      }

      .card__thumbnail {
        width: 100%;
        aspect-ratio: 16 / 9;
        background: var(--color-surface);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        color: #ccc;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        border-bottom: 1px solid var(--color-border);
      }

      .card__body {
        padding: var(--space-6);
      }

      .card__tags {
        display: flex;
        gap: var(--space-2);
        flex-wrap: wrap;
        margin-bottom: var(--space-3);
      }

      .card__tag {
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        background: var(--color-tag-bg);
        color: var(--color-tag-text);
        padding: 3px var(--space-2);
        border-radius: var(--radius-sm);
      }

      .card__title {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--color-text);
        margin-bottom: var(--space-2);
        line-height: 1.3;
      }

      .card__desc {
        font-size: 0.875rem;
        color: var(--color-text-muted);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>

    <article class="card">
      <div class="card__thumbnail">Project thumbnail</div>
      <div class="card__body">
        <div class="card__tags">
          <span class="card__tag">UI Design</span>
          <span class="card__tag">Figma</span>
        </div>
        <h3 class="card__title">Onboarding Flow Redesign</h3>
        <p class="card__desc">Reduced drop-off by 34% through a redesigned 5-step onboarding experience.</p>
      </div>
    </article>

    <article class="card">
      <div class="card__thumbnail">Project thumbnail</div>
      <div class="card__body">
        <div class="card__tags">
          <span class="card__tag">Design System</span>
          <span class="card__tag">React</span>
        </div>
        <h3 class="card__title">Component Library</h3>
        <p class="card__desc">A token-based design system with 40+ components for a SaaS product team.</p>
      </div>
    </article>

  </body>
</html>
